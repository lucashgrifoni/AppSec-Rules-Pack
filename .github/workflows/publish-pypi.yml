name: Publish to PyPI

# Release / publish pipeline (supply-chain evidence). On a version tag it:
#   - builds the wheel and sdist,
#   - generates a CycloneDX SBOM for the built distribution,
#   - attests build provenance (GitHub Artifact Attestations / SLSA),
#   - publishes to PyPI via Trusted Publishing (OIDC) — no long-lived API token,
#   - attaches the SBOM and distribution artifacts to the GitHub Release.
#
# Publishing depends on a PyPI Trusted Publisher being configured for this repository,
# this workflow file, and the "pypi" environment (https://docs.pypi.org/trusted-publishers/).
# That configuration is in place and has published releases end to end. Anyone forking this
# repository has to set up their own before the publish step can succeed; the build, SBOM,
# and attestation steps run without it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Default to least privilege; the job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # OIDC for PyPI Trusted Publishing and provenance attestation
      attestations: write # write the build-provenance attestation
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          # Release publishing reaches several endpoints (PyPI upload, Sigstore,
          # attestation); audit mode records egress without breaking the publish.
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Build distribution artifacts
        run: |
          python -m pip install build
          python -m build

      - name: Generate CycloneDX SBOM for the built distribution
        run: |
          python -m pip install "cyclonedx-bom==7.3.0"
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/python -m pip install dist/*.whl
          cyclonedx-py environment /tmp/sbomenv/bin/python \
            --output-format JSON --output-file sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          # dist/ holds only the wheel and sdist; the SBOM lives at the repo root and
          # is attached to the GitHub Release instead of uploaded to PyPI.
          attestations: true

      - name: Create or update the GitHub Release with SBOM and artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: create the Release (with generated notes) if it does not
          # exist yet for this tag, otherwise just (re)upload the assets.
          #
          # The baseline pack rides along as a Release asset. The distribution ships the
          # validator and the schema but no rules, so this is how a consumer gets a
          # version-pinned copy of the 19 baseline rules without cloning the repository.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              sbom.cdx.json dist/*.whl dist/*.tar.gz rules/appsec-baseline.yaml --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              sbom.cdx.json dist/*.whl dist/*.tar.gz rules/appsec-baseline.yaml \
              --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
          fi
