name: Publish to PyPI

# Release / publish pipeline (supply-chain evidence). On a version tag it:
#   - builds the wheel and sdist,
#   - generates a CycloneDX SBOM for the built distribution,
#   - attests build provenance (GitHub Artifact Attestations / SLSA),
#   - publishes to PyPI via Trusted Publishing (OIDC) — no long-lived API token,
#   - attaches the SBOM, distribution artifacts, baseline pack, and provenance bundle
#     to the GitHub Release.
#
# Publishing depends on a PyPI Trusted Publisher being configured for this repository,
# this workflow file, and the "pypi" environment (https://docs.pypi.org/trusted-publishers/).
# That configuration is in place and has published releases end to end. Anyone forking this
# repository has to set up their own before the publish step can succeed; the build, SBOM,
# and attestation steps run without it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Default to least privilege; the job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # OIDC for PyPI Trusted Publishing and provenance attestation
      attestations: write # write the build-provenance attestation
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          # Release publishing reaches several endpoints (PyPI upload, Sigstore,
          # attestation); audit mode records egress without breaking the publish.
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build distribution artifacts
        run: |
          python -m pip install build
          python -m build

      - name: Generate CycloneDX SBOM for the built distribution
        run: |
          python -m pip install "cyclonedx-bom==7.3.0"
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/python -m pip install dist/*.whl
          cyclonedx-py environment /tmp/sbomenv/bin/python \
            --output-format JSON --output-file sbom.cdx.json

      - name: Attest build provenance
        id: attest
        # Every asset the Release publishes is attested, not only the distribution.
        # `appsec-baseline.yaml` is the one the README tells people to curl, and it is
        # the actual product content -- the wheel deliberately ships no rules. Leaving
        # it unattested meant the only unverifiable asset was the one consumers
        # actually run in their CI gate. The SBOM is included for the same reason: an
        # SBOM nobody can verify is decoration.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            sbom.cdx.json
            rules/appsec-baseline.yaml

      - name: Verify and stage the provenance bundle
        # The bundle becomes a Release asset so consumers (and OpenSSF Scorecard's
        # Signed-Releases check) can verify offline. Verifying it here, before anything
        # is published, means a bundle that does not verify never ships.
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          bundle="appsec-rules-pack-${REF_NAME//\//-}.intoto.jsonl"
          cp "${BUNDLE_PATH}" "${bundle}"
          for asset in dist/*.whl rules/appsec-baseline.yaml; do
            gh attestation verify "${asset}" --repo "${REPO}" --bundle "${bundle}"
          done
          echo "PROVENANCE_BUNDLE=${bundle}" >> "${GITHUB_ENV}"

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # dist/ holds only the wheel and sdist; the SBOM lives at the repo root and
          # is attached to the GitHub Release instead of uploaded to PyPI.
          attestations: true

      - name: Create or update the GitHub Release with SBOM and artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: create the Release (with generated notes) if it does not
          # exist yet for this tag, otherwise just (re)upload the assets.
          #
          # The baseline pack rides along as a Release asset. The distribution ships the
          # validator and the schema but no rules, so this is how a consumer gets a
          # version-pinned copy of the 19 baseline rules without cloning the repository.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              sbom.cdx.json dist/*.whl dist/*.tar.gz rules/appsec-baseline.yaml \
              "${PROVENANCE_BUNDLE}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              sbom.cdx.json dist/*.whl dist/*.tar.gz rules/appsec-baseline.yaml \
              "${PROVENANCE_BUNDLE}" \
              --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
          fi
