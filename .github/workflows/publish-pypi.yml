name: Publish to PyPI

# Release / publish pipeline (supply-chain evidence). On a version tag it:
#   - verifies the tag: it points at a commit on main, it matches the package version,
#     and the test suite and strict baseline validation pass on it;
#   - builds the wheel, the sdist, and a CycloneDX SBOM with hash-pinned tools, in a job
#     that holds no publishing credential and can only reach GitHub and PyPI;
#   - attests build provenance (GitHub Artifact Attestations / SLSA) for every asset;
#   - publishes to PyPI via Trusted Publishing (OIDC), with no long-lived API token;
#   - attaches the SBOM, distribution artifacts, baseline pack, and provenance bundle
#     to the GitHub Release.
#
# Only the `release` job can mint an OIDC token, and it installs nothing: it receives the
# built files, attests them, and publishes them. A compromised build tool therefore never
# runs next to the publishing credential.
#
# Publishing depends on a PyPI Trusted Publisher being configured for this repository,
# this workflow file, and the "pypi" environment (https://docs.pypi.org/trusted-publishers/).
# That configuration is in place and has published releases end to end. Anyone forking this
# repository has to set up their own before the publish step can succeed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Default to least privilege; only the release job widens it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag and test it
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0 # the ancestry check needs main's history

      - name: Check that the tag is on main and matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main"
            exit 1
          fi
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/appsec_rules_pack/__init__.py)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is on main and matches the package version"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install project with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint, test, and validate the baseline
        run: |
          python -m ruff check .
          python -m pytest --cov=appsec_rules_pack --cov-report=term-missing
          python -m appsec_rules_pack validate rules --require-examples --fail-on-warnings

  build:
    name: Build distribution and SBOM
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install hash-pinned build tools
        # Locked from .github/release/requirements.in; see that file to update it.
        run: >-
          python -m pip install --require-hashes --only-binary :all:
          -r .github/release/requirements.txt

      - name: Build distribution artifacts
        # --no-isolation builds with the pinned setuptools and wheel above instead of
        # letting `build` fetch whatever versions PyPI serves at release time.
        run: python -m build --no-isolation

      - name: Generate CycloneDX SBOM for the built distribution
        run: |
          python -m venv --without-pip /tmp/sbomenv
          python -m pip --python /tmp/sbomenv install --only-binary :all: dist/*.whl
          /tmp/sbomenv/bin/python .github/release/sbom_project.py \
            pyproject.toml /tmp/sbom-project.toml
          cyclonedx-py environment /tmp/sbomenv/bin/python \
            --pyproject /tmp/sbom-project.toml --mc-type library \
            --spec-version 1.6 --output-format JSON --output-file sbom.cdx.json
          python .github/release/sbom_purl.py sbom.cdx.json

      - name: Check SBOM root identity and exclude installer components
        run: python .github/release/check_sbom.py sbom.cdx.json

      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-files
          path: |
            dist/
            sbom.cdx.json
            rules/appsec-baseline.yaml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attest and publish
    needs: build
    # A manual run on a branch other than main stops after the build: the pypi
    # environment only admits main and v* tags.
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # OIDC for PyPI Trusted Publishing and provenance attestation
      attestations: write # write the build-provenance attestation
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          # Publishing reaches PyPI, Sigstore, and the attestation API; audit mode records
          # egress without breaking a release. Nothing in this job installs packages.
          egress-policy: audit

      - name: Download the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-files

      - name: Attest build provenance
        id: attest
        # Every asset the Release publishes is attested, not only the distribution.
        # `appsec-baseline.yaml` is the one the README tells people to download, and it
        # is the actual product content -- the wheel deliberately ships no rules. The
        # SBOM is included for the same reason: an SBOM nobody can verify is decoration.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            sbom.cdx.json
            rules/appsec-baseline.yaml

      - name: Verify and stage the provenance bundle
        # The bundle becomes a Release asset so consumers (and OpenSSF Scorecard's
        # Signed-Releases check) can verify offline. Verifying it here, before anything
        # is published, means a bundle that does not verify never ships.
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          bundle="appsec-rules-pack-${REF_NAME//\//-}.intoto.jsonl"
          cp "${BUNDLE_PATH}" "${bundle}"
          for asset in dist/*.whl rules/appsec-baseline.yaml; do
            gh attestation verify "${asset}" --repo "${REPO}" --bundle "${bundle}"
          done
          echo "PROVENANCE_BUNDLE=${bundle}" >> "${GITHUB_ENV}"

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # dist/ holds only the wheel and sdist; the SBOM is attached to the GitHub
          # Release instead of uploaded to PyPI.
          attestations: true

      - name: Create or update the GitHub Release with SBOM and artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Idempotent: create the Release (with generated notes) if it does not
          # exist yet for this tag, otherwise just (re)upload the assets.
          #
          # The baseline pack rides along as a Release asset. The distribution ships the
          # validator and the schema but no rules, so this is how a consumer gets a
          # version-pinned copy of the baseline rules without cloning the repository.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              sbom.cdx.json dist/*.whl dist/*.tar.gz rules/appsec-baseline.yaml \
              "${PROVENANCE_BUNDLE}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              sbom.cdx.json dist/*.whl dist/*.tar.gz rules/appsec-baseline.yaml \
              "${PROVENANCE_BUNDLE}" \
              --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
          fi
