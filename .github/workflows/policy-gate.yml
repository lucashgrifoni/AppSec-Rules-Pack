name: Policy Gate (reference)

# Reference policy gate (see ADR-0004): a SEPARATE workflow consumes the validator's
# JSON output to decide block/warn. Enforcement is never embedded in the validator
# itself — the validator only reports; this workflow makes the gate decision. It runs
# the pack's own CLI against the baseline pack, and `review` against the worked review
# record in examples/review/ (ADR-0006), as worked examples.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rules/**"
      - "src/**"
      - "examples/review/**"
      - ".github/workflows/policy-gate.yml"

# Least privilege: this gate only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: policy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Validate and gate on JSON output
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Produce validation report (JSON)
        run: python -m appsec_rules_pack validate rules --format json > validation.json

      - name: Produce coverage report (JSON)
        run: python -m appsec_rules_pack report coverage rules --format json > coverage.json

      - name: Check the worked review record (JSON)
        # --as-of pins the date so the example's exception does not expire in CI. A real
        # gate omits it, so an expired exception fails the record.
        run: >
          python -m appsec_rules_pack review rules/appsec-baseline.yaml
          examples/review/payments-api-review.yaml
          --as-of 2026-10-05 --fail-on-warnings --format json > review.json

      - name: Gate on the JSON output
        run: |
          python - <<'PY'
          import json
          import sys

          report = json.load(open("validation.json"))
          summary = report["summary"]
          errors, warnings = summary["errors"], summary["warnings"]
          print(f"rules={summary['rules']} errors={errors} warnings={warnings}")

          coverage = json.load(open("coverage.json"))
          for framework, stats in coverage["frameworks"].items():
              print(f"coverage {framework}: {stats['covered']}/{stats['total']}")

          review = json.load(open("review.json"))
          open_blocking = review["summary"]["open_by_enforcement"].get("blocking", 0)
          open_critical = review["summary"]["open_by_severity"].get("critical", 0)
          print(
              f"review {review['review']['subject']}: ok={review['summary']['ok']} "
              f"open blocking={open_blocking} critical={open_critical}"
          )

          # Policy decision (reference): block on any validation error, on an invalid
          # review record, and on any open blocking or critical rule; other open rules
          # and warnings are advisory. Tune these thresholds per your own risk appetite.
          if errors:
              print("::error::policy gate: validation errors present")
              sys.exit(1)
          if not review["summary"]["ok"]:
              print("::error::policy gate: the review record is invalid")
              sys.exit(1)
          if open_blocking or open_critical:
              print("::error::policy gate: open blocking or critical rules")
              sys.exit(1)
          print("policy gate: PASS")
          PY
