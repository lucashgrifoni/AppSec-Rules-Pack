name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and validate rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Run tests with coverage gate
        run: python -m pytest --cov=appsec_rules_pack --cov-report=term-missing

      - name: Validate baseline rules pack (fail on warnings)
        run: python -m appsec_rules_pack validate rules --require-examples --fail-on-warnings

      - name: Build distribution artifacts
        run: python -m build

      - name: Verify distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

  # `requires-python = ">=3.12"` claims 3.13 works, and nothing exercised it. Kept out of
  # the matrix below so the two cross-platform check names stay stable for the ruleset.
  python-next:
    name: Python 3.13 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Validate baseline rules pack (fail on warnings)
        run: python -m appsec_rules_pack validate rules --require-examples --fail-on-warnings

  # Separate job on purpose: the `validate` job above is the required status check in the
  # `main-protection` ruleset, and adding a matrix to it would rename the check and
  # silently break branch protection. This job guards platform portability instead.
  cross-platform:
    name: Cross-platform tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # harden-runner's egress policy targets Linux runners; keep it where it applies
      # instead of failing the Windows leg.
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project with dev dependencies
        run: python -m pip install -e ".[dev]"

      # No coverage gate here: the `validate` job owns it. This leg exists to catch
      # platform-dependent behaviour, such as subprocess output decoded with the
      # machine's locale encoding instead of an explicit one.
      - name: Run tests
        run: python -m pytest

      - name: Validate baseline rules pack (fail on warnings)
        run: python -m appsec_rules_pack validate rules --require-examples --fail-on-warnings
