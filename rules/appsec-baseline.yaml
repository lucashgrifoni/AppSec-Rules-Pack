pack:
  id: appsec-baseline
  name: AppSec Baseline Rules Pack
  version: 0.1.0
  mode: advisory
  owner: appsec
  description: Generic application security baseline rules for review and CI evidence.

rules:
  - id: APPSEC-AUTHZ-001
    title: Enforce server-side object authorization
    description: Verify that every object access is authorized on the server side and does not rely on client-provided identifiers alone.
    severity: high
    category: authorization
    status: enabled
    enforcement: advisory
    targets:
      - api
      - backend
    mappings:
      owasp_asvs:
        - V4.1
      owasp_api_top_10_2023:
        - API1:2023
        - API5:2023
      cwe:
        - CWE-639
      nist_ssdf:
        - PW.8
    evidence:
      required:
        - Object-level authorization check tied to the authenticated principal.
        - Tenant or ownership scope applied before returning or mutating records.
      signals:
        - Negative tests for cross-object or cross-tenant access.
        - Review of service or repository filters for authorization predicates.
    match:
      type: review
      includes:
        - API handlers, services, repositories, jobs, or admin actions that read or mutate user-scoped objects.
      excludes:
        - Static public assets and unauthenticated health checks with no object access.
    remediation:
      guidance: Enforce authorization decisions using trusted server-side context and deny access when ownership or tenant scope cannot be proven.
      validation:
        - Add tests where a user attempts to access an object owned by another user or tenant.
        - Confirm denial is logged without exposing sensitive object details.
    exceptions:
      allowed: true
      max_days: 90
      required_fields:
        - owner
        - justification
        - expires_at
        - compensating_control
    examples:
      compliant:
        language: python
        snippet: |
          record = repo.get(record_id)
          if record.owner_id != request.user.id:
              raise Forbidden()
          return record
        explanation: Ownership is checked against the authenticated user before the record is returned.
      violating:
        language: python
        snippet: |
          # Trusts a client-supplied id with no ownership check.
          return repo.get(request.args["record_id"])
        explanation: Any user can read another user's record by changing record_id (IDOR / broken object-level authorization).

  - id: APPSEC-INPUT-001
    title: Validate untrusted input at boundaries
    description: Require typed validation, length limits, and allowlisted formats for externally supplied input before business logic or storage.
    severity: high
    category: input-validation
    status: enabled
    enforcement: advisory
    targets:
      - api
      - backend
      - frontend
    mappings:
      owasp_asvs:
        - V5.1
      owasp_api_top_10_2023:
        - API8:2023
      cwe:
        - CWE-20
      nist_ssdf:
        - PW.7
    evidence:
      required:
        - Schema or typed parser for request, message, file metadata, or form input.
        - Explicit limits for size, length, range, or accepted enum values.
      signals:
        - Tests for missing, malformed, overlong, and unexpected fields.
        - Rejection behavior that avoids stack traces or internal error details.
    match:
      type: review
      includes:
        - HTTP requests, webhook payloads, CLI inputs, uploaded metadata, queue messages, and user-controlled configuration.
      excludes:
        - Internal constants and trusted compile-time configuration.
    remediation:
      guidance: Validate input at the first trusted boundary using typed schemas and reject invalid data before it reaches downstream sinks.
      validation:
        - Add boundary tests for invalid input classes.
        - Confirm invalid input returns a controlled error response.
    exceptions:
      allowed: true
      max_days: 60
      required_fields:
        - owner
        - justification
        - expires_at
    examples:
      compliant:
        language: python
        snippet: |
          class CreateUser(BaseModel):
              email: EmailStr
              age: int = Field(ge=0, le=130)

          data = CreateUser.model_validate(request.json)
        explanation: A typed schema enforces format and bounds before the value reaches business logic.
      violating:
        language: python
        snippet: |
          # No format, length, or range checks on untrusted input.
          email = request.json["email"]
          age = int(request.json["age"])
        explanation: Unvalidated input flows straight into business logic and storage.

  - id: APPSEC-INJECT-001
    title: Prevent injection into interpreters and queries
    description: Ensure untrusted data is not concatenated into SQL, NoSQL, shell commands, templates, LDAP, XPath, or log formats without effective sanitization.
    severity: critical
    category: injection
    status: enabled
    enforcement: advisory
    targets:
      - api
      - backend
      - ci
    mappings:
      owasp_asvs:
        - V5.3
      owasp_api_top_10_2023:
        - API8:2023
      cwe:
        - CWE-89
        - CWE-78
      nist_ssdf:
        - PW.9
    evidence:
      required:
        - Parameterized query, safe API call, shell-free execution, or allowlisted command arguments.
        - Clear source-to-sink review for any interpreter boundary.
      signals:
        - Tests that malicious metacharacters are treated as data.
        - Absence of string-built queries or commands from untrusted values.
    match:
      type: review
      includes:
        - Database calls, shell execution, templating, dynamic filters, logging templates, and parser expressions.
      excludes:
        - Static queries and commands with no untrusted input.
    remediation:
      guidance: Replace string concatenation with parameterized APIs, structured command invocation, typed builders, or strict allowlists.
      validation:
        - Add tests using representative injection payloads.
        - Confirm the payload is stored, queried, or rendered as inert data.
    exceptions:
      allowed: false
      max_days: 0
      required_fields: []
    examples:
      compliant:
        language: python
        snippet: |
          db.execute(
              "SELECT * FROM users WHERE id = %s",
              (user_id,),
          )
        explanation: The parameterized query binds user_id as data, so it cannot alter the SQL.
      violating:
        language: python
        snippet: |
          db.execute(
              f"SELECT * FROM users WHERE id = {user_id}"
          )
        explanation: Interpolating user_id into the query string enables SQL injection.

  - id: APPSEC-SSRF-001
    title: Restrict user-influenced outbound requests
    description: Guard server-side HTTP, DNS, or metadata fetches influenced by untrusted input with allowlists and private-network protections.
    severity: high
    category: ssrf
    status: enabled
    enforcement: advisory
    targets:
      - api
      - backend
    mappings:
      owasp_asvs:
        - V12.6
      owasp_api_top_10_2023:
        - API7:2023
      cwe:
        - CWE-918
      nist_ssdf:
        - PW.8
    evidence:
      required:
        - Destination allowlist or trusted resolver policy for outbound calls.
        - Blocking of loopback, link-local, private ranges, and cloud metadata endpoints.
      signals:
        - Tests for redirects, DNS rebinding-style changes, and private address ranges.
        - Logs or metrics for blocked outbound destinations without leaking sensitive URLs.
    match:
      type: review
      includes:
        - URL fetchers, webhook callbacks, image importers, metadata importers, SSO metadata retrieval, and proxy endpoints.
      excludes:
        - Fixed outbound destinations owned by configuration and not influenced by users.
    remediation:
      guidance: Resolve and validate destinations before connecting, block unsafe network ranges, and keep redirects within the same policy.
      validation:
        - Add deny tests for loopback, link-local, private ranges, and unexpected redirects.
        - Confirm allowed destinations still work through explicit allowlist entries.
    exceptions:
      allowed: true
      max_days: 30
      required_fields:
        - owner
        - justification
        - expires_at
        - compensating_control
    examples:
      compliant:
        language: python
        snippet: |
          host = urlparse(url).hostname
          if host not in ALLOWED_HOSTS:
              raise Forbidden()
          requests.get(url, allow_redirects=False)
        explanation: The destination is allowlisted and redirects are disabled before the request is made.
      violating:
        language: python
        snippet: |
          # Fetches any user-supplied URL, including internal and metadata hosts.
          requests.get(request.args["url"])
        explanation: The user controls the destination, enabling SSRF to internal services or cloud metadata.

  - id: APPSEC-AUTHN-001
    title: Enforce strong authentication and session integrity
    description: Verify credentials, multi-factor where required, and session tokens are validated server-side and rotated on privilege change to prevent spoofing or fixation.
    severity: high
    category: authentication
    status: enabled
    enforcement: advisory
    targets:
      - api
      - backend
      - frontend
    mappings:
      owasp_asvs:
        - V2.1
        - V3.2
      owasp_api_top_10_2023:
        - API2:2023
      cwe:
        - CWE-287
        - CWE-384
      nist_ssdf:
        - PW.1
    evidence:
      required:
        - Server-side credential and session validation tied to the authenticated principal.
        - Session rotation on login and privilege change, with secure cookie or token handling.
      signals:
        - Tests for invalid credentials, expired sessions, and reused or fixated tokens.
        - Review of authentication flows for missing server-side checks.
    match:
      type: review
      includes:
        - Login handlers, token issuance, session middleware, password reset, and privilege transitions.
      excludes:
        - Unauthenticated public endpoints with no session or credential handling.
    remediation:
      guidance: Validate credentials and sessions server-side, rotate identifiers on privilege change, and rely on a vetted authentication library rather than custom token logic.
      validation:
        - Add tests for expired, tampered, and reused session tokens.
        - Confirm authentication failures are logged without exposing credential material.
    exceptions:
      allowed: true
      max_days: 60
      required_fields:
        - owner
        - justification
        - expires_at
        - compensating_control
    examples:
      compliant:
        language: python
        snippet: |
          session = sessions.validate(request.cookies["sid"])
          if not session:
              raise Unauthorized()
          session = sessions.rotate(session)  # rotate on privilege change
        explanation: The session is validated server-side and rotated when privilege changes.
      violating:
        language: python
        snippet: |
          # Trusts a client-provided identity with no session validation.
          user_id = request.cookies["user_id"]
        explanation: Identity is taken from an unvalidated cookie, allowing spoofing and session fixation.

  - id: APPSEC-SECRETS-001
    title: Keep secrets out of code, logs, and rules
    description: Detect and prevent credentials, tokens, private keys, session identifiers, and sensitive values from being committed or logged.
    severity: high
    category: secrets
    status: enabled
    enforcement: advisory
    targets:
      - backend
      - frontend
      - ci
      - general
    mappings:
      owasp_asvs:
        - V14.8
      owasp_api_top_10_2023:
        - API8:2023
      cwe:
        - CWE-798
        - CWE-532
      nist_ssdf:
        - PW.4
    evidence:
      required:
        - Secrets are loaded from approved environment or secret-manager boundaries.
        - Logs redact tokens, credentials, session identifiers, and sensitive personal data.
      signals:
        - Secret scanning in repository and CI.
        - Tests or review evidence for log redaction paths.
    match:
      type: review
      includes:
        - Source code, tests, configs, rules, logs, CI workflows, examples, and documentation.
      excludes:
        - Public sample values clearly marked as inert examples.
    remediation:
      guidance: Remove sensitive values from code and history, rotate exposed credentials, and replace logs with redacted structured fields.
      validation:
        - Run secret scanning against the repository.
        - Add tests for redaction of sensitive fields.
    exceptions:
      allowed: false
      max_days: 0
      required_fields: []
    examples:
      compliant:
        language: python
        snippet: |
          api_key = os.environ["PAYMENTS_API_KEY"]
          logger.info("payments client configured")  # no secret in logs
        explanation: The secret is read from the environment at runtime and never written to logs.
      violating:
        language: python
        snippet: |
          API_KEY = "REPLACE_ME"  # hard-coded and committed to source
          logger.info("using api key %s", API_KEY)  # also leaked to logs
        explanation: A credential is embedded in source control and written to logs.

  - id: APPSEC-FILE-001
    title: Harden file upload and file path handling
    description: Validate file type, size, storage location, and path handling before accepting or processing user-controlled files.
    severity: high
    category: file-handling
    status: enabled
    enforcement: advisory
    targets:
      - api
      - backend
      - frontend
    mappings:
      owasp_asvs:
        - V12.1
      owasp_api_top_10_2023:
        - API4:2023
        - API8:2023
      cwe:
        - CWE-22
        - CWE-434
      nist_ssdf:
        - PW.7
    evidence:
      required:
        - Server-side file size and type validation.
        - Storage path isolation that prevents traversal and execution.
      signals:
        - Tests for path traversal, unexpected extensions, oversized files, and malformed content.
        - Review of storage permissions and generated filenames.
    match:
      type: review
      includes:
        - Upload handlers, importers, export endpoints, file processors, archive extraction, and generated download paths.
      excludes:
        - Build-time static assets with trusted source control provenance.
    remediation:
      guidance: Store uploads outside executable paths, generate server-side filenames, validate content and size, and deny path traversal.
      validation:
        - Add tests for traversal sequences and invalid content types.
        - Confirm uploaded files cannot be executed or retrieved without authorization.
    exceptions:
      allowed: true
      max_days: 30
      required_fields:
        - owner
        - justification
        - expires_at
        - compensating_control
    examples:
      compliant:
        language: python
        snippet: |
          if upload.content_type not in ALLOWED_TYPES or upload.size > MAX_SIZE:
              raise BadRequest()
          name = f"{uuid4()}{safe_ext(upload.filename)}"
          path = (UPLOAD_DIR / name).resolve()
          if UPLOAD_DIR not in path.parents:
              raise BadRequest()
        explanation: Type, size, and the resolved storage path are validated before the file is written.
      violating:
        language: python
        snippet: |
          # Writes a user-named file directly under a served directory.
          dest = os.path.join("uploads", request.files["f"].filename)
          open(dest, "wb").write(request.files["f"].read())
        explanation: An attacker-controlled filename enables path traversal and overwriting other files.

  - id: APPSEC-LOG-001
    title: Log security events without leaking sensitive data
    description: Record authentication, authorization, and integrity-relevant events with enough context for detection while redacting credentials, tokens, and personal data.
    severity: medium
    category: logging
    status: enabled
    enforcement: advisory
    targets:
      - backend
      - api
      - ci
    mappings:
      owasp_asvs:
        - V7.1
      owasp_api_top_10_2023:
        - API8:2023
      cwe:
        - CWE-778
        - CWE-532
      nist_ssdf:
        - RV.1
    evidence:
      required:
        - Security-relevant events are logged with actor, action, and outcome.
        - Logs redact secrets, session identifiers, and sensitive personal data.
      signals:
        - Tests confirming redaction of sensitive fields in log output.
        - Review of log sinks for retention and access controls.
    match:
      type: review
      includes:
        - Authentication, authorization, configuration change, and error-handling log paths.
      excludes:
        - High-volume debug traces explicitly disabled in production builds.
    remediation:
      guidance: Emit structured security events with stable fields, redact sensitive values at the logging boundary, and route logs to a monitored sink.
      validation:
        - Add tests asserting sensitive fields are redacted before logging.
        - Confirm security events reach the monitored log destination.
    exceptions:
      allowed: true
      max_days: 90
      required_fields:
        - owner
        - justification
        - expires_at
    examples:
      compliant:
        language: python
        snippet: |
          logger.info(
              "login",
              extra={"user_id": user.id, "outcome": "success"},
          )
        explanation: A security event is logged with stable structured fields and no secrets.
      violating:
        language: python
        snippet: |
          logger.info("login %s with password %s", user.email, raw_password)
        explanation: Credentials and personal data are written directly into log output.

  - id: APPSEC-DEP-001
    title: Manage known-vulnerable and unmaintained dependencies
    description: Track direct and transitive dependencies, remediate known-vulnerable versions, and avoid unmaintained components that increase supply-chain risk.
    severity: high
    category: dependency-risk
    status: enabled
    enforcement: advisory
    targets:
      - dependencies
      - ci
      - backend
    mappings:
      owasp_asvs:
        - V14.2
      owasp_api_top_10_2023:
        - API8:2023
      cwe:
        - CWE-1104
        - CWE-1395
      nist_ssdf:
        - PW.4
    evidence:
      required:
        - Dependency inventory or lockfile under version control.
        - Software composition analysis with a remediation or exception path for known-vulnerable versions.
      signals:
        - SCA results triaged for reachability and fix availability.
        - Review of unmaintained or unpinned dependencies.
    match:
      type: review
      includes:
        - Manifests, lockfiles, base images, and build-time dependency resolution.
      excludes:
        - Vendored test fixtures with no runtime exposure.
    remediation:
      guidance: Pin dependencies, upgrade or replace known-vulnerable versions, and document a justified exception with compensating controls when an upgrade is blocked.
      validation:
        - Run software composition analysis and confirm no unresolved high or critical findings without an exception.
        - Confirm the dependency manifest and lockfile are consistent.
    exceptions:
      allowed: true
      max_days: 60
      required_fields:
        - owner
        - justification
        - expires_at
        - compensating_control
    examples:
      compliant:
        language: toml
        snippet: |
          # Pinned to an exact, maintained version and scanned by SCA in CI.
          requests = "==2.32.3"
        explanation: An exact pin keeps the resolved version reviewable and triaged for known CVEs.
      violating:
        language: toml
        snippet: |
          # Unbounded range can resolve to an unknown, possibly vulnerable release.
          requests = "*"
        explanation: A floating version can silently pull in a known-vulnerable or unmaintained release.

  - id: APPSEC-CONFIG-001
    title: Apply secure defaults and remove risky configuration
    description: Ship hardened default configuration, disable unused features and verbose errors, and keep environment-specific settings outside the application artifact.
    severity: medium
    category: configuration
    status: enabled
    enforcement: advisory
    targets:
      - backend
      - api
      - iac
    mappings:
      owasp_asvs:
        - V14.1
      owasp_api_top_10_2023:
        - API8:2023
      cwe:
        - CWE-16
        - CWE-1188
      nist_ssdf:
        - PW.9
    evidence:
      required:
        - Secure default configuration with unused features and debug endpoints disabled.
        - Environment-specific configuration supplied at deploy time, not embedded in the artifact.
      signals:
        - Review of default settings, error verbosity, and exposed management interfaces.
        - Tests or checks confirming hardened defaults in built artifacts.
    match:
      type: configuration
      includes:
        - Application settings, framework defaults, server and container configuration, and feature flags.
      excludes:
        - Local development overrides clearly scoped to non-production use.
    remediation:
      guidance: Set secure defaults, disable verbose errors and unused endpoints, and inject environment configuration at deploy time through trusted boundaries.
      validation:
        - Confirm production builds disable debug and verbose error output.
        - Confirm configuration secrets are sourced from approved boundaries, not the artifact.
    exceptions:
      allowed: true
      max_days: 90
      required_fields:
        - owner
        - justification
        - expires_at
    examples:
      compliant:
        language: yaml
        snippet: |
          debug: false
          expose_admin: false
          errors:
            verbose: false
        explanation: Production defaults disable debug mode, admin surfaces, and verbose error output.
      violating:
        language: yaml
        snippet: |
          debug: true          # verbose stack traces in production
          expose_admin: true   # management endpoints reachable
        explanation: Debug output and admin endpoints are exposed in a production configuration.

  - id: APPSEC-SESSION-001
    title: Harden session cookies and session lifecycle
    description: Set secure session cookie attributes, rotate identifiers on privilege change, and invalidate sessions on logout to prevent hijacking and fixation.
    severity: high
    category: authentication
    status: enabled
    enforcement: advisory
    targets:
      - api
      - backend
      - frontend
    mappings:
      owasp_asvs:
        - V3.4
      owasp_api_top_10_2023:
        - API2:2023
      cwe:
        - CWE-614
        - CWE-384
        - CWE-613
      nist_ssdf:
        - PW.1
    evidence:
      required:
        - Session cookies set HttpOnly, Secure, and an explicit SameSite policy.
        - Session identifiers rotate on privilege change and are invalidated server-side on logout.
      signals:
        - Tests for missing cookie flags, session fixation, and reuse after logout.
        - Review of session idle timeout, expiry, and revocation handling.
    match:
      type: review
      includes:
        - Session middleware, cookie configuration, login and logout handlers, and privilege transitions.
      excludes:
        - Stateless tokens with no server-side session and no cookie-based identity.
    remediation:
      guidance: Configure HttpOnly, Secure, and SameSite cookie attributes, rotate session identifiers on privilege change, and invalidate sessions server-side on logout with a bounded idle timeout.
      validation:
        - Add tests asserting session cookies carry HttpOnly, Secure, and SameSite.
        - Confirm a session is unusable after logout and after its idle timeout.
    exceptions:
      allowed: true
      max_days: 60
      required_fields:
        - owner
        - justification
        - expires_at
        - compensating_control
    examples:
      compliant:
        language: javascript
        snippet: |
          res.cookie("sid", id, {
            httpOnly: true,
            secure: true,
            sameSite: "lax",
            maxAge: 900000,
          });
        explanation: The session cookie sets HttpOnly, Secure, SameSite, and a bounded lifetime.
      violating:
        language: javascript
        snippet: |
          // No HttpOnly/Secure/SameSite and no expiry: exposed to theft and fixation.
          res.cookie("sid", id);
        explanation: A session cookie without security attributes is readable by scripts and never expires.

  - id: APPSEC-XSS-001
    title: Encode output to prevent cross-site scripting
    description: Encode or escape untrusted data for its output context so user-controlled values render as inert text rather than executable markup or script.
    severity: high
    category: injection
    status: enabled
    enforcement: advisory
    targets:
      - frontend
      - backend
      - api
    mappings:
      owasp_asvs:
        - V5.3
      owasp_api_top_10_2023:
        - API8:2023
      cwe:
        - CWE-79
        - CWE-80
      nist_ssdf:
        - PW.9
    evidence:
      required:
        - Context-aware output encoding for HTML, attribute, JavaScript, and URL sinks.
        - Templates escape by default and only bypass escaping for vetted, sanitized values.
      signals:
        - Tests that script payloads render as inert text in the response.
        - Review of raw/unescaped template directives and innerHTML-style sinks.
    match:
      type: review
      includes:
        - Server-side templates, client-side rendering, response builders, and any sink that emits user-controlled data into markup.
      excludes:
        - Static markup with no user-controlled values.
    remediation:
      guidance: Render untrusted data through context-aware output encoding, keep template auto-escaping on, and sanitize any value that must be emitted as markup.
      validation:
        - Add tests injecting script payloads and confirm they are escaped in the output.
        - Confirm raw/unescaped rendering paths are removed or routed through a sanitizer.
    exceptions:
      allowed: true
      max_days: 30
      required_fields:
        - owner
        - justification
        - expires_at
        - compensating_control
    examples:
      compliant:
        language: text
        snippet: |
          <!-- EJS auto-escapes with <%= %> -->
          <h1><%= product.name %></h1>
        explanation: The escaped output directive renders the product name as inert text.
      violating:
        language: text
        snippet: |
          <!-- EJS <%- %> emits raw, unescaped HTML -->
          <h1><%- product.name %></h1>
        explanation: Raw output of a user-controlled product name allows stored or reflected XSS.
