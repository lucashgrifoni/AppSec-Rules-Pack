[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-rules-pack"
dynamic = ["version"]
description = "Generic AppSec policy-as-code rules pack and validator."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "AppSec Rules Pack Maintainers" }]
dependencies = [
    "jsonschema>=4.21,<5",
    "PyYAML>=6.0.1,<7",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
]

[project.scripts]
appsec-rules = "appsec_rules_pack.cli:app"

[tool.setuptools.dynamic]
version = { attr = "appsec_rules_pack.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
appsec_rules_pack = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["appsec_rules_pack"]

[tool.coverage.report]
fail_under = 90
show_missing = true
