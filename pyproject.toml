[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-rules-pack"
dynamic = ["version"]
description = "Generic AppSec policy-as-code rules pack and validator."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Henrique Grifoni" }]
keywords = [
    "appsec",
    "application-security",
    "policy-as-code",
    "security-rules",
    "secure-code-review",
    "devsecops",
    "owasp-asvs",
    "ci-quality-gate",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
# Floors are the lowest versions the `min-deps` CI job tests. typer 0.12.x could make
# every command exit 0 without validating, typer below 0.16 cannot render --help with
# click 8.3, and click below 8.3.3 has a known advisory.
dependencies = [
    "click>=8.3.3",
    "jsonschema>=4.21,<5",
    "PyYAML>=6.0.1,<7",
    "typer>=0.16,<1",
]

[project.urls]
Homepage = "https://github.com/lucashgrifoni/AppSec-Rules-Pack"
Repository = "https://github.com/lucashgrifoni/AppSec-Rules-Pack"
Issues = "https://github.com/lucashgrifoni/AppSec-Rules-Pack/issues"
Changelog = "https://github.com/lucashgrifoni/AppSec-Rules-Pack/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "hypothesis>=6.100,<7",
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
]

[project.scripts]
appsec-rules = "appsec_rules_pack.cli:app"

[tool.setuptools.dynamic]
version = { attr = "appsec_rules_pack.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
appsec_rules_pack = ["schemas/*.json", "templates/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["appsec_rules_pack"]

[tool.coverage.report]
# Raised from 90 once actual coverage settled above 97%. A gate far below the real
# number permits a silent regression the size of the gap.
fail_under = 95
show_missing = true
